services:
  db:
    image: postgres:16-alpine
    container_name: clinica-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: clinica_atelier
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinica -d clinica_atelier']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: clinica-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - '3000:3000'

    environment:
      DATABASE_URL: postgresql://clinica:clinica@db:5432/clinica_atelier
      JWT_SECRET: docker-dev-secret

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend

    container_name: clinica-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - '5173:5173'

    environment:
      VITE_API_URL: http://localhost:3000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
